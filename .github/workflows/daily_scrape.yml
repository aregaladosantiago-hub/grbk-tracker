name: GRBK Daily Scrape

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily_scrape.yml"
      - "config/**"
      - "grbk_tracker/**"
      - "requirements.txt"

concurrency:
  group: grbk-daily-scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run scraper
        run: |
          python -m grbk_tracker.scrape

      - name: Validate snapshot
        run: |
          python -m grbk_tracker.validate

      - name: Generate report
        run: |
          python -m grbk_tracker.report

      - name: Commit updated outputs
        run: |
          git config user.name "grbk-tracker-bot"
          git config user.email "grbk-tracker-bot@example.com"
          git add data reports
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update GRBK tracker outputs"
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git pull --rebase origin "$BRANCH_NAME"
          git push origin "HEAD:$BRANCH_NAME"

